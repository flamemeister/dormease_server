  function uploadAndSignPdf() {
    const fileInput = document.getElementById("pdfFile");
    if (!fileInput.files[0]) return alert("Выберите PDF-файл");

    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const base64Pdf = reader.result.split(",")[1];
      signPdf(base64Pdf);
    };
    reader.readAsDataURL(file);
  }

  function signPdf(base64Pdf) {
    const socket = new WebSocket("wss://127.0.0.1:13579/");
    socket.onopen = () => {
      const request = {
        module: "kz.gov.pki.knca.basics",
        method: "sign",
        args: {
          allowedStorages: ["PKCS12"],
          format: "cms",
          data: base64Pdf,
          signingParams: {
            decode: true,
            encapsulate: true,
            digested: false
          },
            signerParams: {
            extKeyUsageOids: ["1.2.398.3.3.4.3.2"],  
            chain: [certPEM]                         
            }

        }
      };

      socket.send(JSON.stringify(request));
    };

    socket.onmessage = (event) => {
      const response = JSON.parse(event.data);
      if (response.status && response.body?.result) {
        const pem = response.body.result[0];
        downloadFile(pem, "signed_contract.p7s");
      } else {
        alert("❌ Подпись не удалась: " + JSON.stringify(response));
      }
    };

    socket.onerror = () => {
      alert("❌ NCALayer не отвечает. Убедитесь, что он запущен.");
    };
  }

  function downloadFile(pemString, filename) {
    const blob = new Blob([pemString], { type: "application/pkcs7-signature" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }
